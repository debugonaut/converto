name: Verify and Package Converto

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: dart tool/verify_cli.dart
      - run: node --test test/launcher_test.cjs
      - run: python -m unittest discover -s test/tool -p 'test_*bundle.py'
      - run: python -m pip install -r tool/audit-requirements.txt
      - name: Audit self-contained runtime
        shell: bash
        run: python tool/audit_cli.py --binary "$(cat build/cli-path.txt)" --profile standalone --output build/audit/standalone
      - name: Check real terminal behavior
        shell: bash
        run: python tool/test_terminal.py --binary "$(cat build/cli-path.txt)" --output build/audit/terminal
      - name: Audit GUI execution and transactional outputs on desktop
        run: dart run tool/audit_gui.dart
      - name: Install Linux desktop build/runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libgl1-mesa-dri xvfb dbus-x11 dpkg-dev
      - name: Build native Linux app
        if: runner.os == 'Linux'
        run: flutter build linux --release --no-pub
      - name: Package and verify portable and Debian Linux apps
        if: runner.os == 'Linux'
        run: python tool/package_linux.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-app-x64
          compression-level: 0
          path: |
            Converto-Linux-x64.tar.gz
            Converto-Linux-amd64.deb
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: linux-app-audit
          path: |
            build/audit/linux-app/
            build/audit/gui/results.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && failure()
        with:
          name: linux-app-diagnostics
          compression-level: 0
          path: |
            Converto-Linux-x64.tar.gz
            Converto-Linux-amd64.deb
      - name: Build native Windows app
        if: runner.os == 'Windows'
        run: flutter build windows --release --no-pub
      - name: Package and verify portable Windows app
        if: runner.os == 'Windows'
        run: python tool/package_windows.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-app-x64
          compression-level: 0
          path: Converto-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-app-audit
          path: |
            build/audit/windows-app/package.json
            build/audit/gui/results.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && failure()
        with:
          name: windows-app-diagnostics
          compression-level: 0
          path: Converto-Windows-x64.zip
      - name: Build native Mac app
        if: runner.os == 'macOS'
        run: flutter build macos --release --no-pub
      - name: Package Mac preview
        if: runner.os == 'macOS'
        run: python tool/package_macos.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-app-AppleSilicon
          compression-level: 0
          path: Converto-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-app-Intel
          compression-level: 0
          path: Converto-macOS-x86_64.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos-app-audit
          path: |
            build/audit/gui/results.json
            build/audit/gui/package.json
      - name: Install optional local codecs on Linux for full format audit
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice webp fonts-noto-cjk
      - name: Audit all formats with optional local codecs
        if: runner.os == 'Linux'
        shell: bash
        run: python tool/audit_cli.py --binary "$(cat build/cli-path.txt)" --output build/audit/full
      - name: Package CLI bundle and native libraries
        shell: python
        run: |
          import pathlib, platform, subprocess, sys
          binary = pathlib.Path('build/cli-path.txt').read_text().strip()
          output = 'Converto-' + platform.system() + '-' + platform.machine() + '-CLI.zip'
          subprocess.run([sys.executable, 'tool/package_cli.py', '--binary', binary, '--output', output], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-${{ runner.os }}
          path: |
            Converto-*-CLI.zip
            build/audit/**/results.json
            build/audit/**/terminal-results.json
            build/audit/terminal/*.log
