name: Build Android preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build per-architecture preview APKs
        run: flutter build apk --release --split-per-abi --no-pub
      - name: Verify manifest, native engines and APK signatures
        run: python3 tool/audit_android.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: android-preview-apks
          compression-level: 0
          path: build/app/outputs/flutter-apk/*-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-package-audit
          path: build/audit/android/package.json
