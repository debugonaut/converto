name: Build iOS preview

on:
  push:
    branches: [main, codex/mobile-preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: simulator
            flags: --simulator --debug
            app: build/ios/iphonesimulator/Runner.app
            artifact: ios-simulator-preview
            archive: Converto-iOS-Simulator.zip
          - target: device
            flags: --release --no-codesign
            app: build/ios/iphoneos/Runner.app
            artifact: ios-device-unsigned
            archive: Converto-iOS-unsigned.zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: .dart_tool/hooks_runner
          key: ios-native-3.47.9-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('pubspec.lock') }}
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: dart tool/verify_cli.dart
      - name: Build iOS ${{ matrix.target }} preview
        run: flutter build ios ${{ matrix.flags }} --no-pub
      - name: Verify iOS package
        run: python3 tool/audit_ios.py "${{ matrix.app }}" --output "build/audit/ios/${{ matrix.target }}.json"
      - name: Archive iOS app
        run: ditto -c -k --sequesterRsrc --keepParent "${{ matrix.app }}" "build/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          compression-level: 0
          path: build/${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-${{ matrix.target }}-package-audit
          path: build/audit/ios/*.json
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: .dart_tool/hooks_runner
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
